[build]
builder = "DOCKERFILE"
dockerfilePath = "/infra/docker/source-import.Dockerfile"
dockerfileTarget = "runtime"
watchPatterns = ["/backend/**", "/infra/docker/source-import.Dockerfile", "/infra/docker/source-import-entrypoint.sh"]

[deploy]
startCommand = "python -m clipah.source_connectors.readiness && celery --app clipah.source_connectors.worker:app worker --queues source_import --concurrency $CLIPAH_SOURCE_IMPORT_CONCURRENCY --loglevel INFO"
healthCommand = "python -m clipah.source_connectors.readiness"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
overlapSeconds = "0"
drainingSeconds = "45"

[clipah]
requiredVariables = ["CLIPAH_WORKER_DATABASE_URL", "CLIPAH_REDIS_URL", "CLIPAH_OBJECT_STORE_ENDPOINT", "CLIPAH_OBJECT_STORE_BUCKET", "CLIPAH_OBJECT_STORE_ACCESS_KEY_ID", "CLIPAH_OBJECT_STORE_SECRET_ACCESS_KEY", "CLIPAH_SECRET_ENCRYPTION_KEY", "CLIPAH_SOURCE_IMPORT_CONCURRENCY"]
